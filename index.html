<!DOCTYPE html>
<html>
<head>
    <title>Explore World</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: linear-gradient(to right, #00b4db, #0083b0);
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #004d66;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        .hero {
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center/cover;
            height: 400px;
            color: white;
            text-align: center;
            padding-top: 150px;
        }

        .hero h1 {
            font-size: 50px;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        .places {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .card img {
            width: 100%;
            height: 150px;
        }

        .card h3 {
            margin: 10px 0;
        }

        .form-box {
            background: #f2f2f2;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background-color: #0083b0;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            background-color: #005f73;
        }

        footer {
            background-color: #002b36;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Explore World 🌍</h1>
    <p>Your Travel Partner</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Destinations</a>
    <a href="#">Booking</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    <h1>Travel the World ✈️</h1>
    <p>Adventure Starts Here</p>
</div>

<div class="section">
    <h2>Popular Destinations</h2>
    <div class="places">
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34">
            <h3>Paris</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
            <h3>Maldives</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad">
            <h3>Dubai</h3>
        </div>

    </div>
</div>

<div class="section">
    <h2>Book Your Trip</h2>
    <div class="form-box">
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email" required>
            <select>
                <option>Select Destination</option>
                <option>Paris</option>
                <option>Maldives</option>
                <option>Dubai</option>
            </select>
            <input type="date">
            <button type="submit">Book Now</button>
        </form>
    </div>
</div>

<footer>
    <p>© 2026 Explore World | Travel Website</p>
</footer>

</body>
</html>
